<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Visual Gallery of Dai Viet Hung Tran — AI Researcher & Engineer."
    />
    <meta name="theme-color" content="#090a0f" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script>
      try {
        const savedTheme = localStorage.getItem("portfolio-theme");
        document.documentElement.dataset.theme =
          savedTheme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <title>Gallery | Dai Viet Hung Tran</title>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    <header class="site-header">
      <div class="shell nav">
        <a class="brand" href="index.html" aria-label="Dai Viet Hung Tran - Home">
          <img class="brand__avatar" src="assets/images/hung-tran-profile.png" alt="" />
          <span>Dai Viet Hung Tran</span>
        </a>

        <div class="nav-links" id="nav-links">
          <a href="index.html">Home</a>
          <a href="experience.html">Experience</a>
          <a href="projects.html">Projects</a>
          <a href="gallery.html" class="is-active" aria-current="page">Gallery</a>
          <a href="contact.html">Contact</a>
        </div>

        <div class="nav-actions">
          <button class="theme-toggle" type="button" aria-label="Toggle theme">
            <svg class="theme-icon theme-icon--sun" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
            </svg>
            <svg class="theme-icon theme-icon--moon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
          </button>

          <a
            class="btn btn-secondary btn-sm"
            href="https://calendly.com/trandaiviethung2001/30min"
            target="_blank"
            rel="noreferrer"
            data-calendly-open
          >Book meeting</a>

          <button
            class="nav-toggle"
            type="button"
            aria-label="Open navigation"
            aria-expanded="false"
            aria-controls="nav-links"
          >
            <span></span><span></span><span></span>
          </button>
        </div>
      </div>
    </header>

    <main id="main-content">
      <section class="section">
        <div class="shell">
          <div class="section-header">
            <span class="section-label">Archive</span>
            <h1 class="section-title">Visual Gallery</h1>
            <p class="section-desc">
              Snapshots of research prototypes, computer vision benchmarks, and project exhibits.
            </p>
          </div>

          <div class="gallery-toolbar">
            <input
              class="gallery-search"
              type="search"
              id="gallery-search"
              placeholder="Search exhibits..."
              aria-label="Search exhibits"
            />
            <div class="gallery-count">
              <span id="count-number">0</span> exhibits
            </div>
          </div>

          <div class="gallery-grid" id="gallery-grid" role="region" aria-label="Gallery exhibits">
            <!-- Rendered by gallery.js -->
          </div>
        </div>
      </section>
      <!-- Modal Lightbox -->
    <div
      class="modal"
      id="gallery-modal"
      role="dialog"
      aria-modal="true"
      aria-hidden="true"
      aria-labelledby="modal-title"
    >
      <div class="modal-dialog">
        <div class="modal-topbar">
          <h3 class="modal-title" id="modal-title">Exhibit</h3>
          <button class="modal-close" id="modal-close" type="button" aria-label="Close modal">Close [ESC]</button>
        </div>
        <div class="modal-media">
          <div class="modal-nav">
            <button class="modal-nav-btn" id="modal-prev" type="button" aria-label="Previous">◀</button>
            <button class="modal-nav-btn" id="modal-next" type="button" aria-label="Next">▶</button>
          </div>
          <img class="modal-image" src="" alt="" id="modal-image" />
        </div>
      </div>
    </div>
    </main>

    

    <footer class="footer">
      <div class="shell footer-inner">
        <div>&copy; <span id="year">2026</span> Dai Viet Hung Tran. All rights reserved.</div>
        <div><a href="#main-content">Back to top &uarr;</a></div>
      </div>
    </footer>

    <script src="https://assets.calendly.com/assets/external/widget.js" async></script>
    <script src="gallery.js"></script>
    <script src="script.js"></script>
  </body>
</html>
